<script>


/* ---------------------------------------------------
   MOSTIRADIO – HRX PLAYER LOGIC
--------------------------------------------------- */

const radioAudio     = document.getElementById("mosti-radio-player");
const radioPlayBtn   = document.getElementById("radio-play");
const radioStopBtn   = document.getElementById("radio-stop");
const radioVolume    = document.getElementById("radio-volume");
const radioStatusEl  = document.getElementById("radio-status");
const radioListeners = document.getElementById("radio-listeners");
const radioTitleEl   = document.getElementById("radio-title");
const radioArtistEl  = document.getElementById("radio-artist");
const radioCover     = document.getElementById("radio-cover");
const radioEq        = document.getElementById("radio-eq");
const radioHint      = document.getElementById("radio-hint");   // ⭐ NEU
  
let lastSong = "";

// Dein Icecast-Mount (MP3)
const RADIO_STREAM_URL = "https://server37508.streamplus.de:10850/stream.mp3";

// Icecast JSON-Status
const RADIO_STATUS_URL = "https://server37508.streamplus.de:10850/status-json.xsl";

/* Play – immer spielen */
radioPlayBtn.addEventListener("click", () => {
  // Hinweis sofort anzeigen
  radioHint.style.display = "block";

  radioAudio.src = RADIO_STREAM_URL;
  radioAudio.play()
    .then(() => {
      radioStatusEl.textContent = "🔴 ON AIR";
      radioStatusEl.classList.add("on");
      radioEq.classList.add("active");
      radioPlayBtn.textContent = "⏸ Pause";

      // Hinweis ausblenden, sobald der Stream läuft
      radioHint.style.display = "none";
    })
    .catch(err => {
      console.error("Fehler beim Starten:", err);
      radioStatusEl.textContent = "⚠ Fehler";
    });
});

/* Stop */
radioStopBtn.addEventListener("click", () => {
  radioAudio.pause();
  radioAudio.currentTime = 0;
  radioStatusEl.textContent = "🟡 Gestoppt";
  radioStatusEl.classList.remove("on");
  radioEq.classList.remove("active");
  radioPlayBtn.textContent = "▶ Play";

  // Hinweis ausblenden, falls er noch sichtbar ist
  radioHint.style.display = "none";
});

/* Volume */
radioVolume.addEventListener("input", () => {
  radioAudio.volume = parseFloat(radioVolume.value);
});

/* Status / Now Playing */
async function loadAlbumCover(artist, song) {

    if (!artist || !song) {
        radioCover.src = "img/default-cover.png";
        return;
    }

    try {

        const response = await fetch(
            `https://itunes.apple.com/search?term=${encodeURIComponent(
                artist + " " + song
            )}&entity=song&limit=1`
        );

        const data = await response.json();

        if (data.results.length > 0) {

            const newCover =
    data.results[0].artworkUrl100.replace(
        "100x100",
        "600x600"
    );

radioCover.classList.add("fade");

setTimeout(() => {

    radioCover.src = newCover;

    radioCover.onload = () => {

        radioCover.classList.remove("fade");

    };

}, 250);

        } else {

            radioCover.classList.add("fade");

setTimeout(() => {

    radioCover.src = "img/default-cover.png";

    radioCover.onload = () => {

        radioCover.classList.remove("fade");

    };

}, 250);

        }

    } catch (e) {

        console.error(e);
        radioCover.src = "img/default-cover.png";

    }

}
async function updateRadioStatus() {
  try {
    const res = await fetch(RADIO_STATUS_URL);
    if (!res.ok) return;

    const data = await res.json();
    console.log(data);
    let source = data.icestats.source;
   console.log(JSON.stringify(source, null, 2));

if (Array.isArray(source)) {
    source = source[0];
}

if (!source) return;

    const listeners = source.listeners || 0;
const title =
    source.title ||
    source.server_name ||
    source.server_description ||
    "Unbekannter Titel";
let artist = source.artist || "";
let songTitle = title;

if (!artist) {

    const parts = title.split("-");

    if (parts.length >= 2) {

        artist = parts.shift().trim();
        songTitle = parts.join("-").trim();

    }

}
    console.log("TITLE:", title);
    console.log("ARTIST:", artist);

// Live-DJ erkennen
const upperTitle = title.toUpperCase();

const isDJLive = upperTitle.includes("LIVE ON AIR");

// DJ-Name ermitteln
let djName = title
    .replace(/LIVE ON AIR/gi, "")
    .trim();

djName = djName
    .replace(/^-/, "")
    .replace(/-$/, "")
    .trim();

if (isDJLive && djName === "") {
    djName = "Live DJ";
}

radioListeners.textContent = `👥 ${listeners} Listener`;

if (isDJLive) {

    radioTitleEl.textContent = `🎙 ${djName}`;

    radioArtistEl.textContent = "Jetzt live für euch auf MostiRadio";

    radioCover.style.display = "none";

} else {
  
    radioTitleEl.textContent = songTitle;

    radioArtistEl.textContent = artist;

    radioCover.style.display = "block";

    const currentSong = artist + " - " + songTitle;

if (currentSong !== lastSong) {

    lastSong = currentSong;

    loadAlbumCover(artist, songTitle);

  }
}

const djStatus = document.getElementById("dj-status");
const djChat = document.getElementById("dj-chat");

if (isDJLive) {

    djStatus.style.display = "block";
    djStatus.innerHTML =
    `🎙 <strong>${djName}</strong><br>LIVE ON AIR`;

    djChat.style.display = "block";

    // Name noch nicht vergeben?
    if (!localStorage.getItem("mostiChatName")) {

        document
            .getElementById("chatNamePopup")
            .classList.add("show");

    }

} else {

    djStatus.style.display = "none";
    djChat.style.display = "none";

    document
        .getElementById("chatNamePopup")
        .classList.remove("show");

}
    
    if (listeners > 0) {
      radioStatusEl.textContent = "🔴 ON AIR";
      radioStatusEl.classList.add("on");
    } else {
      radioStatusEl.textContent = "🟡 Online";
      radioStatusEl.classList.remove("on");
    }

  } catch (err) {
    console.error("Status Fehler:", err);
  }
}

document.addEventListener("DOMContentLoaded", () => {
  updateRadioStatus();
  setInterval(updateRadioStatus, 15000);
});
  </script>

<script>
// Firebase starten
if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

// Elemente
const chatBox = document.getElementById("dj-chat");
const chatMessages = document.getElementById("chat-messages");
const chatInput = document.getElementById("chat-input");
const chatSend = document.getElementById("chat-send");
let autoScroll = true;

chatMessages.addEventListener("scroll", () => {

    const distanceFromBottom =
        chatMessages.scrollHeight -
        chatMessages.scrollTop -
        chatMessages.clientHeight;

    autoScroll = distanceFromBottom < 40;

});
  
const chatNamePopup = document.getElementById("chatNamePopup");
const chatUsername = document.getElementById("chatUsername");
const saveChatName = document.getElementById("saveChatName");

let username = localStorage.getItem("mostiChatName") || "";

saveChatName.addEventListener("click", ()=>{

    const name = chatUsername.value.trim();

    if(name.length < 3){

        alert("Bitte mindestens 3 Zeichen eingeben.");

        return;

    }

    username = name;

    localStorage.setItem("mostiChatName", username);

    chatNamePopup.classList.remove("show");

});

// Nachricht senden
chatSend.addEventListener("click", () => {
  const msg = chatInput.value.trim();
  if (!msg) return;

  db.ref("chat").push({
   user: username,
    text: msg,
    time: Date.now()
  });

// Chat auf die letzten 30 Nachrichten begrenzen
db.ref("chat")
    .orderByChild("time")
    .once("value", snapshot => {

        const messages = [];

        snapshot.forEach(child => {
            messages.push(child);
        });

        while (messages.length > 30) {

            messages.shift().ref.remove();

        }

    });
  
  chatInput.value = "";
});

  // ENTER sendet Nachricht
chatInput.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {

        event.preventDefault();

        chatSend.click();

    }

});

// =====================================
// Benutzerfarben
// =====================================

const USER_COLORS = [
    "#22c55e", // Grün
    "#3b82f6", // Blau
    "#f97316", // Orange
    "#ec4899", // Pink
    "#a855f7", // Lila
    "#14b8a6", // Türkis
    "#eab308", // Gelb
    "#ef4444", // Rot
    "#06b6d4", // Cyan
    "#84cc16"  // Hellgrün
];

function getUserColor(username) {

    // Feste Farben
    if (username === "🤖 MostiBot") return "#22c55e";
    if (username === "HyptryX") return "#FFD700";

    // DJ immer hellblau
    const djStatus = document.getElementById("dj-status");

    if (
        djStatus &&
        djStatus.style.display !== "none" &&
        djStatus.innerText.includes(username)
    ) {
        return "#38bdf8";
    }

    let hash = 0;

    for (let i = 0; i < username.length; i++) {
        hash = username.charCodeAt(i) + ((hash << 5) - hash);
    }

    return USER_COLORS[Math.abs(hash) % USER_COLORS.length];

}
  
// Nachrichten empfangen
db.ref("chat").on("child_added", snapshot => {

    const data = snapshot.val();

    console.log("CHAT EMPFANGEN:", data.id, data.text);

    const message = document.createElement("div");
    message.className = "chat-message";

    const user = document.createElement("span");
    user.className = "chat-user";

    let icon = "👤";

// MostiBot
if (data.bot === true) {

    icon = "";

}
// Streamer
else if (data.user === "HyptryX") {

    icon = "👑";

}
// DJ
else {

    const djStatus =
        document.getElementById("dj-status");

    if (
        djStatus &&
        djStatus.style.display !== "none" &&
        djStatus.innerText.includes(data.user)
    ) {

        icon = "🎙";

    }

}

    user.textContent = icon
    ? `${icon} ${data.user}`
    : data.user;

user.style.color = getUserColor(data.user);

const text = document.createElement("div");
text.className = "chat-text";
text.textContent = data.text;

message.appendChild(user);
message.appendChild(text);

    chatMessages.appendChild(message);

if (autoScroll) {

    chatMessages.scrollTop =
        chatMessages.scrollHeight;

}

  // Bot über neue Nachricht informieren
if (typeof handleCommand === "function") {
    handleCommand(data.user, data.text);
}
  
});
  
</script>
