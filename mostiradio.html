<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MostiRadio – Der Sound im Mostviertel</title>

  <!-- Orbitron Schrift -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=999">
</head>

<body>

<nav class="main-nav">
  <ul>
    <li><a href="index.html">Startseite</a></li>
    <li><a href="events.html">Events</a></li>
    <li><a href="mostiradio.html">MostiRadio</a></li>
  </ul>
</nav>

<section class="radio-page">
  <h2 class="section-title">MostiRadio</h2>

  <div class="radio-box">
    <div class="radio-status" id="radio-status">🔴 OFF AIR</div>

    <div class="radio-eq">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <button class="radio-play-btn" id="radio-play-btn">▶ Play MostiRadio</button>

    <audio id="mosti-radio-player" preload="none"></audio>
  </div>
</section>

<!-- StreamingCloud Player Script -->
<script src="https://s13.streamingcloud.online/dist/widgets.js" defer></script>

<script>
document.addEventListener("DOMContentLoaded", async function() {

  const statusEl = document.getElementById("radio-status");
  const eqEl = document.querySelector(".radio-eq");
  const playBtn = document.getElementById("radio-play-btn");
  const audioPlayer = document.getElementById("mosti-radio-player");

  // JSON-URL
  const apiUrl = "https://s13.streamingcloud.online/json/stream/32138";

  async function checkStatus() {
    try {
      const response = await fetch(apiUrl);
      const data = await response.json();

      if (data.status === "online" && data.source === "connected") {
        statusEl.textContent = "🟢 ON AIR";
        statusEl.classList.add("on");
        eqEl.classList.add("active");
        return true;
      } else {
        statusEl.textContent = "🔴 OFF AIR";
        statusEl.classList.remove("on");
        eqEl.classList.remove("active");
        return false;
      }

    } catch (e) {
      statusEl.textContent = "🔴 OFF AIR";
      statusEl.classList.remove("on");
      eqEl.classList.remove("active");
      return false;
    }
  }

  // Play Button
  playBtn.addEventListener("click", async () => {
    const isOnline = await checkStatus();

    if (!isOnline) {
      playBtn.textContent = "⚠ Kein Stream verfügbar";
      return;
    }

    audioPlayer.src = "https://s13.streamingcloud.online/stream/32138";
    audioPlayer.play();

    playBtn.textContent = "🎧 Läuft…";
  });

  // Initial Status Check
  checkStatus();
});
</script>

</body>
</html>
