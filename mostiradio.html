<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MostiRadio – Der Sound im Mostviertel</title>

  <!-- Orbitron Schrift -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=999">
</head>

<body>

<nav class="main-nav">
  <ul>
    <li><a href="index.html">Startseite</a></li>
    <li><a href="events.html">Events</a></li>
    <li><a href="mostiradio.html">MostiRadio</a></li>
  </ul>
</nav>

<section class="radio-page">
  <h2 class="section-title">MostiRadio</h2>

  <div class="radio-box">
    <div class="radio-status" id="radio-status">🔴 OFF AIR</div>

    <div class="radio-eq">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <button class="radio-play-btn" id="radio-play-btn">▶ Play MostiRadio</button>

    <div id="mosti-radio-player"></div>
  </div>
</section>

<!-- StreamingCloud Player Script -->
<script src="https://s13.streamingcloud.online/dist/widgets.js" defer></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // HRX-Player einbinden
  StreamingCloudWidgets.player({
    elementId: "mosti-radio-player",
    streamId: "32138",
    width: "100%",
    height: "180px",
    theme: "dark"
  });

  const statusEl = document.getElementById("radio-status");
  const eqEl = document.querySelector(".radio-eq");
  const playBtn = document.getElementById("radio-play-btn");

  // 🔍 Stream-Status prüfen (einfacher Check über die öffentliche Seite)
  fetch("https://s13.streamingcloud.online/public/32138")
    .then(() => {
      // Seite erreichbar → wir gehen von ON AIR aus
      statusEl.textContent = "🟢 ON AIR";
      statusEl.classList.add("on");
      eqEl.classList.add("active");
    })
    .catch(() => {
      statusEl.textContent = "🔴 OFF AIR";
      statusEl.classList.remove("on");
      eqEl.classList.remove("active");
    });

  // HRX-Play-Button Verhalten
  playBtn.addEventListener("click", () => {
    if (statusEl.classList.contains("on")) {
      playBtn.textContent = "🎧 Läuft…";
    } else {
      playBtn.textContent = "⚠ Kein Stream verfügbar";
    }
    document.getElementById("mosti-radio-player").scrollIntoView({ behavior: "smooth" });
  });
});
</script>

</body>
</html>
