<section class="events-page">
  <h2 class="section-title">Events</h2>

  <div class="event-grid">

    <!-- Juli Event -->
    <div class="event-card" onclick="openEvent('juli')">
      <img src="img/event-juli.png" class="event-img">
      <h3 class="event-title">🔥 Mega Event im Juli! 🔥</h3>
    </div>

    <!-- Gewinnspiel -->
    <div class="event-card" onclick="openEvent('gewinnspiel')">
      <img src="img/gewinnspiel.png" class="event-img">
      <h3 class="event-title">🎁 Gewinnspiel</h3>
    </div>

  </div>
</section>

<div id="event-overlay" class="event-overlay">
  <div class="event-overlay-content">
    <img id="event-overlay-img" src="">
    <button onclick="closeEvent()" class="overlay-close">Schließen</button>
  </div>
</div>

<script>
function openEvent(type) {
  const overlay = document.getElementById("event-overlay");
  const img = document.getElementById("event-overlay-img");

  if (type === "juli") {
    img.src = "img/event-juli.png";
  }

  if (type === "gewinnspiel") {
    img.src = "img/gewinnspiel.png";
  }

  overlay.style.display = "flex";
}

function closeEvent() {
  const overlay = document.getElementById("event-overlay");
  overlay.style.display = "none";
}

/* OPTIONALER PC-FIX – falls Klicks hängen bleiben */
document.getElementById("event-overlay").addEventListener("click", (e) => {
  // Wenn man außerhalb des Inhalts klickt → schließen
  if (e.target.id === "event-overlay") {
    closeEvent();
  }
});

</script>
